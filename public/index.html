<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>통계 단원 코딩</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<link rel="stylesheet" href="/style.css">
<link rel="icon" href="data:,">
</head>
<body>
<header class="top">
  <div class="brand">통계 단원 코딩</div>
  <label class="sel">목록 <select id="bookSel"></select></label>
  <label class="sel">내 이름 <select id="coderSel"></select></label>
  <nav class="tabs" id="tabs">
    <button data-tab="code" class="on">코딩</button>
    <button data-tab="compare">비교·일치율</button>
    <button data-tab="results">최종 코드</button>
    <button data-tab="stats">통계표</button>
    <button data-tab="agree">합의</button>
    <button data-tab="codebook">코드북</button>
    <button data-tab="settings">설정</button>
  </nav>
  <button id="printBtn" class="help" title="지금 고른 책 전체를 쪽 이미지·상자 번호·내 코드와 함께 인쇄">🖨</button>
  <div id="saveState" class="save"></div>
  <button id="helpBtn" class="help" title="사용 안내 다시 보기">?</button>
</header>

<main>
  <!-- 코딩 -->
  <section id="tab-code" class="tab on">
    <div class="code-layout">
      <aside class="pages" id="pageList"></aside>
      <div class="viewer">
        <div class="vtool">
          <button id="prevPage" title="이전 쪽">◀</button>
          <span id="pageLabel"></span>
          <button id="nextPage" title="다음 쪽">▶</button>
          <span class="sp"></span>
          <button id="addBox" title="쪽 이미지에서 끌어서 새 박스를 그립니다">+ 박스 추가</button>
          <label class="toggle"><input type="checkbox" id="editMode"> 박스 이동·크기</label>
          <span id="editHelp" class="hint hidden">박스를 끌어서 이동 · 오른쪽 아래 모서리로 크기 조절</span>
          <span class="sp"></span>
          <button id="zoomOut">−</button><span id="zoomLabel">100%</span><button id="zoomIn">+</button>
        </div>
        <div class="stage-wrap" id="stageWrap">
          <div class="stage" id="stage">
            <img id="pageImg" alt="">
            <div id="boxes"></div>
            <div id="drawBox" class="box drawing hidden"></div>
          </div>
          <div id="noPage" class="empty hidden">이 교과서에는 아직 쪽 이미지가 없습니다.</div>
        </div>
        <div id="curView" class="cur-view hidden"></div>
      </div>
      <aside class="panel">
        <div id="unitPanel"></div>
        <div class="unit-list-head">
          <b>분석 단위</b> <span id="progress"></span>
          <label class="mini"><input type="checkbox" id="onlyTodo"> 안 한 것만</label>
        </div>
        <div class="unit-list" id="unitList"></div>
        <div class="panel-foot">
          <button id="doneBtn" class="primary"></button>
          <button id="exportMine">내 코딩 CSV</button>
          <button id="importCells" title="Claude가 준 코딩 파일(CSV: 단위ID, 4×3 칸)을 내 이름으로 한꺼번에 넣습니다">코딩 가져오기</button><input type="file" id="importFile" accept=".csv,text/csv" hidden>
        </div>
      </aside>
    </div>
  </section>

  <!-- 비교 -->
  <section id="tab-compare" class="tab">
    <div id="compareBody" class="pad"></div>
  </section>

  <!-- 과제별 결과: 분석 단위마다 코더별 4×3 -->
  <section id="tab-results" class="tab">
    <div id="resultsBody" class="pad"></div>
  </section>

  <!-- 통계 -->
  <section id="tab-stats" class="tab">
    <div id="statsBody" class="pad"></div>
  </section>

  <!-- 합의 -->
  <section id="tab-agree" class="tab">
    <div id="agreeBody" class="pad"></div>
  </section>

  <!-- 코드북 -->
  <section id="tab-codebook" class="tab">
    <div id="codebookBody" class="pad"></div>
  </section>

  <!-- 설정 -->
  <section id="tab-settings" class="tab">
    <div id="settingsBody" class="pad"></div>
  </section>
</main>

<div id="gate" class="gate hidden">
  <div class="gate-card">
    <h2>주소를 확인하세요</h2>
    <p>조원에게 받은 주소로 들어오세요.</p>
    <input id="gateKey" placeholder="주소 뒤 단어">
    <button id="gateGo" class="primary">들어가기</button>
  </div>
</div>
<div id="who" class="gate hidden">
  <div class="gate-card who-card">
    <h2>누구인가요?</h2>
    <p class="hint">고른 이름으로 코딩이 저장됩니다. 나중에 위쪽 '내 이름'에서 바꿀 수 있어요.</p>
    <div id="whoList" class="who-list"></div>
  </div>
</div>
<div id="tour" class="tour hidden"><div id="tourHole" class="tour-hole"></div><div id="tourCard" class="tour-card"></div></div>
<div id="tip" class="tipbox hidden"></div>
<div id="toast" class="toast hidden"></div>
<script src="/app.js"></script>
</body>
</html>
